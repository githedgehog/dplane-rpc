[package]
name = "dplane-rpc"
version = "1.1.2"
edition = "2024"
license = "Apache-2.0"

[dependencies]
bytes = { version = "1.9.0", features = ["serde"] }
log = { version = "0.4.22" }
mac_address = { version = "1.1.7" }
mio = { version = "1.0.3", features = ["net", "os-ext"] }
num-derive = "0.4"
num-traits = "0.2"
tracing = { version = "0.1.40", default-features = false, features = ["attributes"] }
tracing-subscriber = { version = "0.3.18" }
tracing-test = { version = "0.2.5" }

[dev-dependencies]
rand = "0.9.0"

[build-dependencies]
cbindgen = { version = "0.27.0" }
